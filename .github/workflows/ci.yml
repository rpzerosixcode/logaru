# Continuous Integration for the logstyout gem.
#
# Runs on pushes and pull requests to main:
# - RSpec test suite
# - RuboCop lint (fails on offenses)
# - Gem build sanity check
#
# Ruby versions mirror `required_ruby_version` in logstyout.gemspec (>= 3.3.0).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} | ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.3", "3.4", "4.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

      - name: Build gem (sanity check)
        run: gem build logstyout.gemspec --strict
